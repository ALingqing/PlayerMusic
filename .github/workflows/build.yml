name: Build PlayerMusic

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许创建 Release / 上传产物

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 下载并准备内置 ffmpeg（不存入 git 仓库，构建时临时下载）
      - name: 下载内置 ffmpeg
        run: |
          mkdir -p native_tmp
          # amd64 (x86_64): BtbN 静态构建 (GitHub Release，Actions 内访问快且稳)
          echo "下载 amd64 ffmpeg..."
          curl -fL --retry 5 --retry-all-errors -o native_tmp/ffmpeg-amd64.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xJf native_tmp/ffmpeg-amd64.tar.xz -C native_tmp
          find native_tmp -type f -name ffmpeg -exec cp {} native_tmp/ffmpeg-amd64 \;
          # arm64: BtbN 静态构建 (GitHub Release)
          echo "下载 arm64 ffmpeg..."
          curl -fL --retry 5 --retry-all-errors -o native_tmp/ffmpeg-arm64.tar.xz \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz"
          tar -xJf native_tmp/ffmpeg-arm64.tar.xz -C native_tmp
          find native_tmp -type f -name ffmpeg -exec cp {} native_tmp/ffmpeg-arm64 \;
          # gzip 压缩并放入 Maven 资源目录
          mkdir -p main/resources/native
          gzip -c -9 native_tmp/ffmpeg-amd64 > main/resources/native/ffmpeg-linux-amd64.gz
          gzip -c -9 native_tmp/ffmpeg-arm64 > main/resources/native/ffmpeg-linux-arm64.gz
          ls -lh main/resources/native/

      - name: 使用 Maven 构建
        run: mvn -B clean package

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PlayerMusic-jar
          path: target/PlayerMusic-*.jar
          if-no-files-found: error

      # 仅当推送了 tag (如 v1.1.71) 时创建 GitHub Release
      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/PlayerMusic-*.jar
          generate_release_notes: true
