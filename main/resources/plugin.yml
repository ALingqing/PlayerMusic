name: PlayerMusic
version: ${project.version}
main: icu.epochcraft.MusicPlayerPlugin
api-version: '26.2'
author: ALingqing
description: ${project.description}

commands:
  bf:
    description: 主音乐播放器命令。
    usage: "/bf <play|stop|gui|createroom|join|start|roomplay|disbandroom|reload|rescan|info>"
    aliases: [music, pm]
  internal_join_room:
    description: Internal command to join a music room.
    usage: "/internal_join_room <roomId>"
    permission: playermusic.internal.join

permissions:
  playermusic.reload:
    description: 允许重载插件配置。
    default: op
  playermusic.play:
    description: 允许使用 /bf play。
    default: true
  playermusic.stop:
    description: 允许使用 /bf stop。
    default: true
  playermusic.gui:
    description: 允许使用 /bf gui。
    default: true
  playermusic.createroom:
    description: 允许使用 /bf createroom 创建音乐室。
    default: true
  playermusic.joinroom:
    description: 允许使用 /bf join 加入音乐室。
    default: true
  playermusic.room.start:
    description: 允许音乐室创建者使用 /bf start 播放音乐。
    default: true
  playermusic.roomplay:
    description: 允许音乐室创建者使用 /bf roomplay 切换房间歌曲。
    default: true
  playermusic.disbandroom:
    description: 允许音乐室创建者使用 /bf disbandroom。
    default: true
  playermusic.info:
    description: 允许使用 /bf info 查看插件信息。
    default: true
  playermusic.internal.join:
    description: Allows internal joining to rooms (e.g. via specific plugin features).
    default: op